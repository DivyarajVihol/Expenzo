<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset Complete — EXPENZO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-color: #09090B;
      --card-bg: rgba(255, 255, 255, 0.03);
      --primary-grad: linear-gradient(135deg, #6366F1, #8B5CF6);
      --accent-color: #06B6D4;
      --text-primary: #FFFFFF;
      --text-secondary: #94A3B8;
      --border-color: rgba(255, 255, 255, 0.08);
      --success: #22C55E;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.5rem; overflow-x: hidden; }

    .bg-wrapper { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(circle at 50% 20%, #0f2e1a 0%, #0d1117 50%, #09090B 100%); }
    .bg-grid { position: absolute; inset: 0; background-size: 50px 50px; background-image: linear-gradient(to right, rgba(255,255,255,0.01) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.01) 1px, transparent 1px); mask-image: radial-gradient(circle at 50% 40%, black 30%, transparent 80%); -webkit-mask-image: radial-gradient(circle at 50% 40%, black 30%, transparent 80%); z-index: 2; }

    .auth-card {
      position: relative; z-index: 20;
      width: 100%; max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(34,197,94,0.2);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 40px rgba(34,197,94,0.06);
      text-align: center;
      animation: slideUp 0.8s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .success-circle {
      width: 88px; height: 88px; margin: 0 auto 2rem;
      background: rgba(34,197,94,0.1);
      border: 2px solid rgba(34,197,94,0.4);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      animation: popIn 0.6s cubic-bezier(0.16,1,0.3,1) 0.2s both;
    }
    @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .card-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.6rem; }
    .card-subtitle { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.65; margin-bottom: 2rem; }

    .btn-primary { width: 100%; height: 52px; border-radius: 14px; background: var(--primary-grad); border: none; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; box-shadow: 0 4px 15px rgba(99,102,241,0.2); transition: all 0.3s cubic-bezier(0.16,1,0.3,1); text-decoration: none; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(139,92,246,0.5); }

    .branding { position: relative; z-index: 20; text-align: center; margin-bottom: 1.75rem; }
    .branding-name { font-size: 1.6rem; font-weight: 800; letter-spacing: 4px; background: linear-gradient(to right, #FFFFFF, #94A3B8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body>
  <div class="bg-wrapper"><div class="bg-grid"></div></div>

  <div class="branding">
    <div class="branding-name">EXPENZO</div>
  </div>

  <main class="auth-card">
    <div class="success-circle">
      <i data-lucide="check-circle-2" style="width:44px;height:44px;color:#22C55E;"></i>
    </div>

    <h1 class="card-title">Password Reset Complete</h1>
    <p class="card-subtitle">
      Your password has been successfully reset. You can now login using your new password.
    </p>

    <a href="{% url 'login' %}" class="btn-primary">
      <i data-lucide="log-in" style="width:18px;height:18px;"></i>
      Log In
    </a>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
