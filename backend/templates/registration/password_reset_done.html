<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Link Sent — EXPENZO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg-color: #09090B;
      --card-bg: rgba(255, 255, 255, 0.03);
      --primary-grad: linear-gradient(135deg, #6366F1, #8B5CF6);
      --accent-color: #06B6D4;
      --text-primary: #FFFFFF;
      --text-secondary: #94A3B8;
      --border-color: rgba(255, 255, 255, 0.08);
      --success: #22C55E;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.5rem; overflow-x: hidden; }

    .bg-wrapper { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(circle at 50% 20%, #1E1B4B 0%, #111827 50%, #09090B 100%); }
    .bg-grid { position: absolute; inset: 0; background-size: 50px 50px; background-image: linear-gradient(to right, rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.015) 1px, transparent 1px); mask-image: radial-gradient(circle at 50% 40%, black 30%, transparent 80%); -webkit-mask-image: radial-gradient(circle at 50% 40%, black 30%, transparent 80%); z-index: 2; }

    .auth-card {
      position: relative; z-index: 20;
      width: 100%; max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 3rem 2.25rem;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      text-align: center;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .icon-circle {
      width: 80px; height: 80px; margin: 0 auto 1.75rem;
      background: rgba(6,182,212,0.1);
      border: 2px solid rgba(6,182,212,0.3);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    .card-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.75rem; }
    .card-subtitle { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.65; margin-bottom: 2rem; }

    .btn-secondary { width: 100%; height: 50px; border-radius: 12px; background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); font-size: 0.95rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: all 0.2s ease; text-decoration: none; }
    .btn-secondary:hover { border-color: rgba(255,255,255,0.2); color: var(--text-primary); background: rgba(255,255,255,0.04); }

    .branding { position: relative; z-index: 20; text-align: center; margin-bottom: 2rem; }
    .branding-name { font-size: 2rem; font-weight: 800; letter-spacing: 4px; background: linear-gradient(to right, #FFFFFF, #94A3B8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body>
  <div class="bg-wrapper"><div class="bg-grid"></div></div>

  <div class="branding">
    <div class="branding-name">EXPENZO</div>
  </div>

  <main class="auth-card">
    <div class="icon-circle">
      <i data-lucide="check-circle" style="width:36px;height:36px;color:#06B6D4;"></i>
    </div>

    <h1 class="card-title">Reset Email Sent</h1>
    <p class="card-subtitle">
      We've sent password reset instructions to your email address, if an account exists with the email you entered. You should receive them shortly.
    </p>

    <a href="{% url 'login' %}" class="btn-secondary">
      <i data-lucide="arrow-left" style="width:16px;height:16px;"></i>
      Back to Login
    </a>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
